name: Apply Preview Database Migrations

on:
  workflow_dispatch:

jobs:
  apply-preview-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shadow_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      # Generate a down migration script back to the current production database, then generate an up migration script to the current branch's migrations directory
      # This 2-step process allows us to apply our migrations in the same way they will be applied in production
      - name: Generate Migrations
        env:
          SHADOW_DATABASE_PRISMA_URL: postgres://user:password@localhost:5432/shadow_db
        run: |
          # Prisma 7 no longer accepts database URLs on the command line, so each
          # command reads the datasource from prisma.config.ts via DATABASE_PRISMA_URL
          DATABASE_PRISMA_URL="${{ secrets.DATABASE_PRISMA_URL }}" \
          bun prisma db pull \
            --config ./packages/db/prisma.config.ts \
            --print > production.prisma

          DATABASE_PRISMA_URL="${{ secrets.PREVIEW_DATABASE_PRISMA_URL }}" \
          bun prisma migrate diff \
            --config ./packages/db/prisma.config.ts \
            --from-config-datasource \
            --to-schema production.prisma \
            --script > down.sql

          DATABASE_PRISMA_URL="${{ secrets.DATABASE_PRISMA_URL }}" \
          bun prisma migrate diff \
            --config ./packages/db/prisma.config.ts \
            --from-config-datasource \
            --to-migrations "./packages/db/prisma/migrations" \
            --script > up.sql

      - name: Apply Migrations
        env:
          DATABASE_PRISMA_URL: ${{ secrets.PREVIEW_DATABASE_PRISMA_URL }}
        run: |
          bun prisma db execute \
            --config ./packages/db/prisma.config.ts \
            --file down.sql

          bun prisma db execute \
            --config ./packages/db/prisma.config.ts \
            --file up.sql
