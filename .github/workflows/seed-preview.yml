name: Seed Preview Database

on:
  workflow_dispatch:

jobs:
  seed-preview-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - name: Reset and Seed Preview Database
        run: bun prisma migrate reset --force && bun prisma db seed
        working-directory: packages/db
        env:
          DATABASE_PRISMA_URL: ${{ secrets.PREVIEW_DATABASE_PRISMA_URL }}
